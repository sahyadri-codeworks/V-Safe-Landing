<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V-Safe World — Coming Soon</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  --white:#ffffff;
  --g1:#edf7f1;
  --g2:#c8e8d4;
  --g3:#6dbe90;
  --g4:#38905c;
  --g5:#1c5235;
  --text:#1a2e22;
  --soft:#567a65;
  --muted:#96b5a2;
  --line:#ddeee4;
}

html,body{height:100%}

body{
  min-height:100vh;
  background:var(--white);
  color:var(--text);
  font-family:'Outfit',sans-serif;
  font-weight:300;
  display:flex;
  flex-direction:column;
  overflow-x:hidden;
}

.blush{
  position:fixed;
  top:0;left:0;right:0;
  height:55vh;
  background:radial-gradient(ellipse 110% 70% at 50% -10%, #edf7f1 0%, transparent 72%);
  pointer-events:none;
}

.gridlines{
  position:fixed;
  inset:0;
  background-image:
    linear-gradient(rgba(180,220,195,.28) 1px, transparent 1px),
    linear-gradient(90deg, rgba(180,220,195,.28) 1px, transparent 1px);
  background-size:68px 68px;
  pointer-events:none;
}

header{
  position:relative;
  z-index:10;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:1.2rem 3rem;
  border-bottom:1px solid var(--line);
}

.logo{
  display:flex;
  align-items:center;
  gap:.5rem;
}

.logo-name{
  font-weight:500;
  font-size:.85rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--g5);
}

.header-pill{
  font-size:.66rem;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--muted);
  padding:.28rem .75rem;
  border:1px solid var(--line);
  border-radius:99px;
  background:var(--g1);
}

main{
  position:relative;
  z-index:10;
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:4rem 1.5rem;
  text-align:center;
}

.heading{
  margin-bottom:1.4rem;
}

.h-pre{
  font-family:'Playfair Display',serif;
  font-style:italic;
  font-size:1.1rem;
  color:var(--muted);
  display:block;
}

.h-main{
  font-family:'Playfair Display',serif;
  font-size:4.5rem;
  color:var(--g5);
  line-height:.95;
}

.h-main i{
  color:var(--g4);
  font-style:italic;
}

.tagline{
  font-size:1rem;
  color:var(--soft);
  line-height:1.8;
  margin-bottom:2rem;
}

.countdown{
  display:flex;
  gap:1rem;
  margin-top:2rem;
}

.c-unit{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.c-card{
  width:90px;
  height:90px;
  background:var(--g1);
  border:1px solid var(--g2);
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.c-num{
  font-family:'Playfair Display',serif;
  font-size:2.2rem;
  color:var(--g5);
}

.c-lbl{
  margin-top:.5rem;
  font-size:.65rem;
  letter-spacing:.15em;
  text-transform:uppercase;
  color:var(--muted);
}

.prog-wrap{
  margin-top:2.5rem;
  width:320px;
}

.prog-meta{
  display:flex;
  justify-content:space-between;
  font-size:.7rem;
  color:var(--muted);
  margin-bottom:.4rem;
}

.prog-track{
  height:4px;
  background:var(--g1);
  border-radius:99px;
  overflow:hidden;
}

.prog-fill{
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--g3),var(--g4));
  transition:width 1s ease;
}

footer{
  text-align:center;
  padding:1.4rem;
  border-top:1px solid var(--line);
  font-size:.75rem;
  color:var(--muted);
}
</style>
</head>
<body>

<div class="blush"></div>
<div class="gridlines"></div>

<header>
  <div class="logo">
    <span class="logo-name">V-Safe World</span>
  </div>
  <span class="header-pill">Safety & Training</span>
</header>

<main>

  <div class="heading">
    <span class="h-pre">Introducing</span>
    <span class="h-main">V-Safe <i>World</i></span>
  </div>

  <p class="tagline">
    Building a safer tomorrow —<br>one workplace at a time.
  </p>

  <p style="margin-bottom:1rem;color:#96b5a2;font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;">
    Launching 25 April 2026
  </p>

  <div class="countdown">
    <div class="c-unit">
      <div class="c-card"><span class="c-num" id="cd-d">00</span></div>
      <span class="c-lbl">Days</span>
    </div>
    <div class="c-unit">
      <div class="c-card"><span class="c-num" id="cd-h">00</span></div>
      <span class="c-lbl">Hours</span>
    </div>
    <div class="c-unit">
      <div class="c-card"><span class="c-num" id="cd-m">00</span></div>
      <span class="c-lbl">Minutes</span>
    </div>
    <div class="c-unit">
      <div class="c-card"><span class="c-num" id="cd-s">00</span></div>
      <span class="c-lbl">Seconds</span>
    </div>
  </div>

  <div class="prog-wrap">
    <div class="prog-meta">
      <span>Launch Progress</span>
      <span id="pct">0%</span>
    </div>
    <div class="prog-track">
      <div class="prog-fill" id="prog"></div>
    </div>
  </div>

</main>

<footer>
  Crafted by <a href="https://sahyadricode.online" target="_blank" style="color:#38905c;">Sahyadri Code Works</a>
</footer>

<script>
(function () {
  const LAUNCH = new Date('2026-04-25T00:00:00');
  const START = new Date();

  const dEl = document.getElementById('cd-d');
  const hEl = document.getElementById('cd-h');
  const mEl = document.getElementById('cd-m');
  const sEl = document.getElementById('cd-s');
  const progEl = document.getElementById('prog');
  const pctEl = document.getElementById('pct');

  function pad(n) {
    return n.toString().padStart(2, '0');
  }

  function tick() {
    const now = new Date();
    const diff = LAUNCH - now;

    if (diff <= 0) {
      dEl.textContent = "00";
      hEl.textContent = "00";
      mEl.textContent = "00";
      sEl.textContent = "00";
      progEl.style.width = "100%";
      pctEl.textContent = "100%";
      return;
    }

    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    const mins = Math.floor((diff / (1000 * 60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    dEl.textContent = pad(days);
    hEl.textContent = pad(hours);
    mEl.textContent = pad(mins);
    sEl.textContent = pad(secs);

    const total = LAUNCH - START;
    const gone = now - START;
    const progress = Math.min(100, Math.max(0, (gone / total) * 100));

    progEl.style.width = progress.toFixed(2) + "%";
    pctEl.textContent = progress.toFixed(0) + "%";
  }

  tick();
  setInterval(tick, 1000);
})();
</script>

</body>
</html>
