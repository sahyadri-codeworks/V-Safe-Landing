<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>V-Safe World — Safety Redefined</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-forest: #0f2e1f;
            --emerald: #2d6a4f;
            --mint: #d8f3dc;
            --soft-green: #f0f7f4;
            --text-dark: #1a2e25;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #eefaf3 0%, #f9fbf9 100%);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .hero-card {
            width: 100%;
            max-width: 900px;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(45, 106, 79, 0.1);
            border-radius: 40px;
            padding: 80px 40px;
            position: relative;
            overflow: hidden;
            text-align: center;
            box-shadow: 0 30px 60px rgba(15, 46, 31, 0.05);
        }

        /* Decorative Green Elements */
        .hero-card::before {
            content: '';
            position: absolute;
            top: -100px;
            right: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(45, 106, 79, 0.05) 0%, transparent 70%);
            z-index: -1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--mint);
            color: var(--emerald);
            padding: 8px 18px;
            border-radius: 100px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 32px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: var(--emerald);
            border-radius: 50%;
            display: inline-block;
            animation: pulse 1.5s infinite;
        }

        h1 {
            font-size: clamp(40px, 6vw, 64px);
            font-weight: 600;
            color: var(--deep-forest);
            line-height: 1.1;
            margin-bottom: 20px;
            letter-spacing: -0.04em;
        }

        h1 span {
            color: var(--emerald);
        }

        .description {
            font-size: 18px;
            color: #556b60;
            max-width: 550px;
            margin: 0 auto 50px auto;
            font-weight: 300;
            line-height: 1.6;
        }

        /* Minimalist Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 50px;
        }

        .grid-item {
            background: var(--white);
            border: 1px solid rgba(45, 106, 79, 0.08);
            border-radius: 24px;
            padding: 30px 15px;
            transition: all 0.3s ease;
        }

        .grid-item:hover {
            border-color: var(--emerald);
            box-shadow: 0 15px 30px rgba(45, 106, 79, 0.05);
            transform: translateY(-5px);
        }

        .val {
            font-size: 38px;
            font-weight: 600;
            color: var(--emerald);
            display: block;
        }

        .label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #8fa399;
            margin-top: 5px;
            font-weight: 500;
        }

        /* Professional Progress */
        .progress-section {
            max-width: 450px;
            margin: 0 auto;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 12px;
            font-weight: 600;
            color: var(--emerald);
            text-transform: uppercase;
        }

        .bar-bg {
            height: 8px;
            background: var(--soft-green);
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--emerald), #40916c);
            width: 0%;
            transition: width 1.5s cubic-bezier(0.22, 1, 0.36, 1);
            border-radius: 10px;
        }

        .footer-text {
            margin-top: 60px;
            font-size: 13px;
            color: #8fa399;
        }

        .footer-text a {
            color: var(--emerald);
            text-decoration: none;
            font-weight: 600;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        @media (max-width: 768px) {
            .hero-card { padding: 60px 24px; }
            .grid { grid-template-columns: repeat(2, 1fr); }
            h1 { font-size: 38px; }
        }
    </style>
</head>
<body>

<div class="hero-card">
    <div class="badge">
        <span class="dot"></span>
        Launching Soon
    </div>

    <h1>V-Safe <span>World</span></h1>
    <p class="description">
        The gold standard in workplace safety, compliance, and risk intelligence. We are crafting a safer future for global industries.
    </p>

    <div class="grid">
        <div class="grid-item">
            <span class="val" id="days">00</span>
            <span class="label">Days</span>
        </div>
        <div class="grid-item">
            <span class="val" id="hours">00</span>
            <span class="label">Hours</span>
        </div>
        <div class="grid-item">
            <span class="val" id="mins">00</span>
            <span class="label">Minutes</span>
        </div>
        <div class="grid-item">
            <span class="val" id="secs">00</span>
            <span class="label">Seconds</span>
        </div>
    </div>

    <div class="progress-section">
        <div class="progress-info">
            <span>Development Status</span>
            <span id="percent">0%</span>
        </div>
        <div class="bar-bg">
            <div class="bar-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="footer-text">
        © 2026 V-Safe World. Engineered by <a href="https://sahyadricode.online" target="_blank">Sahyadri Code Works</a>
    </div>
</div>

<script>
    const launchDate = new Date("2026-04-25T00:00:00").getTime();
    const projectStart = new Date("2026-01-01T00:00:00").getTime();

    function update() {
        const now = new Date().getTime();
        const diff = launchDate - now;

        if (diff <= 0) {
            document.querySelectorAll('.val').forEach(v => v.innerText = "00");
            document.getElementById("progressFill").style.width = "100%";
            document.getElementById("percent").innerText = "100%";
            return;
        }

        const d = Math.floor(diff / (86400000));
        const h = Math.floor((diff % 86400000) / 3600000);
        const m = Math.floor((diff % 3600000) / 60000);
        const s = Math.floor((diff % 60000) / 1000);

        document.getElementById("days").innerText = String(d).padStart(2, "0");
        document.getElementById("hours").innerText = String(h).padStart(2, "0");
        document.getElementById("mins").innerText = String(m).padStart(2, "0");
        document.getElementById("secs").innerText = String(s).padStart(2, "0");

        const total = launchDate - projectStart;
        const current = now - projectStart;
        const perc = Math.min(100, Math.max(0, (current / total) * 100));
        
        document.getElementById("progressFill").style.width = perc + "%";
        document.getElementById("percent").innerText = Math.floor(perc) + "%";
    }

    setInterval(update, 1000);
    update();
</script>

</body>
</html>
