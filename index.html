<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>V-Safe World — Coming Soon</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --green:#1f7a4d;
  --green-light:#eaf7f0;
  --green-soft:#cfe9da;
  --text:#173826;
  --muted:#6b8d7b;
  --white:#ffffff;
  --line:#d8e9df;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Inter',sans-serif;
  background:#ffffff;
  color:var(--text);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.container{
  width:100%;
  max-width:900px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  display:grid;
  grid-template-columns:1fr 1fr;
  box-shadow:0 20px 60px rgba(31,122,77,0.08);
}

.left{
  background:linear-gradient(135deg,var(--green) 0%, #145a37 100%);
  color:white;
  padding:60px 48px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.badge{
  display:inline-block;
  padding:8px 14px;
  background:rgba(255,255,255,0.15);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:999px;
  font-size:12px;
  letter-spacing:.12em;
  text-transform:uppercase;
  margin-bottom:24px;
  width:fit-content;
}

h1{
  font-size:48px;
  line-height:1.05;
  margin-bottom:18px;
  font-weight:600;
}

p{
  font-size:16px;
  line-height:1.7;
  opacity:.92;
}

.right{
  padding:60px 48px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  background:var(--green-light);
}

.launch-label{
  font-size:12px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--muted);
  margin-bottom:20px;
}

.countdown{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-bottom:28px;
}

.box{
  background:white;
  border:1px solid var(--line);
  border-radius:18px;
  padding:22px;
  text-align:center;
}

.num{
  font-size:32px;
  font-weight:600;
  color:var(--green);
  margin-bottom:6px;
}

.lbl{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:var(--muted);
}

.progress-wrap{
  margin-top:10px;
}

.progress-meta{
  display:flex;
  justify-content:space-between;
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}

.progress{
  height:8px;
  background:#dceee3;
  border-radius:999px;
  overflow:hidden;
}

.progress-fill{
  width:0%;
  height:100%;
  background:var(--green);
  border-radius:999px;
  transition:width .8s ease;
}

.footer{
  margin-top:28px;
  font-size:13px;
  color:var(--muted);
}

.footer a{
  color:var(--green);
  text-decoration:none;
  font-weight:500;
}

@media(max-width:768px){
  .container{
    grid-template-columns:1fr;
  }

  .left,.right{
    padding:36px 24px;
  }

  h1{
    font-size:36px;
  }
}
</style>
</head>
<body>

<div class="container">

  <div class="left">
    <span class="badge">Launching Soon</span>
    <h1>V-Safe World</h1>
    <p>
      Building a safer tomorrow — one workplace at a time.
      Safety Training, Risk Management, Compliance & Emergency Response.
    </p>
  </div>

  <div class="right">
    <div class="launch-label">Launching 25 April 2026</div>

    <div class="countdown">
      <div class="box">
        <div class="num" id="days">00</div>
        <div class="lbl">Days</div>
      </div>
      <div class="box">
        <div class="num" id="hours">00</div>
        <div class="lbl">Hours</div>
      </div>
      <div class="box">
        <div class="num" id="mins">00</div>
        <div class="lbl">Minutes</div>
      </div>
      <div class="box">
        <div class="num" id="secs">00</div>
        <div class="lbl">Seconds</div>
      </div>
    </div>

    <div class="progress-wrap">
      <div class="progress-meta">
        <span>Launch Progress</span>
        <span id="percent">0%</span>
      </div>
      <div class="progress">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <div class="footer">
      Crafted by <a href="https://sahyadricode.online" target="_blank">Sahyadri Code Works</a>
    </div>
  </div>

</div>

<script>
const launchDate = new Date("2026-04-25T00:00:00").getTime();
const startDate = new Date().getTime();

function updateCountdown() {
  const now = new Date().getTime();
  const diff = launchDate - now;

  if (diff <= 0) {
    document.getElementById("days").textContent = "00";
    document.getElementById("hours").textContent = "00";
    document.getElementById("mins").textContent = "00";
    document.getElementById("secs").textContent = "00";
    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("percent").textContent = "100%";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const mins = Math.floor((diff / (1000 * 60)) % 60);
  const secs = Math.floor((diff / 1000) % 60);

  document.getElementById("days").textContent = String(days).padStart(2, "0");
  document.getElementById("hours").textContent = String(hours).padStart(2, "0");
  document.getElementById("mins").textContent = String(mins).padStart(2, "0");
  document.getElementById("secs").textContent = String(secs).padStart(2, "0");

  const progress = Math.min(100, ((now - startDate) / (launchDate - startDate)) * 100);
  document.getElementById("progressFill").style.width = progress + "%";
  document.getElementById("percent").textContent = Math.floor(progress) + "%";
}

updateCountdown();
setInterval(updateCountdown, 1000);
</script>

</body>
</html>
